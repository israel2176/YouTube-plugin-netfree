name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: zip -r "youtube-netfree-$GITHUB_REF_NAME.zip" manifest.json content.js HTML icon16.png icon48.png icon128.png
      - run: gh release create "$GITHUB_REF_NAME" youtube-netfree-*.zip --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
