name: Release

# בכל דחיפה ל-main: אם הגרסה ב-manifest.json עוד לא פורסמה – בונה zip ומפרסם Release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          TAG="v$(jq -r .version manifest.json)"
          gh release view "$TAG" >/dev/null 2>&1 && { echo "$TAG already released"; exit 0; }
          zip -r "youtube-netfree-$TAG.zip" manifest.json content.js HTML icon16.png icon48.png icon128.png
          gh release create "$TAG" "youtube-netfree-$TAG.zip" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
